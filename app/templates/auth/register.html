{% extends 'base.html' %}
{% block title %}Sign up · {{ app_name }}{% endblock %}
{% block content %}
<div class="mx-auto max-w-sm">
  <h1 class="mb-6 text-2xl font-bold">Create your account</h1>
  {% if error %}<p class="mb-4 rounded-lg bg-rose-50 px-4 py-2 text-sm text-rose-700">{{ error }}</p>{% endif %}
  <form action="/register" method="post" class="space-y-4 rounded-2xl border border-slate-200 bg-white p-6">
    <div>
      <label class="block text-sm font-medium text-slate-700">Email</label>
      <input type="email" name="email" required autofocus
             class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-400">
    </div>
    <div>
      <label class="block text-sm font-medium text-slate-700">Password</label>
      <input type="password" name="password" required minlength="8"
             class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-400">
      <p class="mt-1 text-xs text-slate-400">At least 8 characters.</p>
    </div>
    <button class="w-full rounded-lg bg-indigo-600 px-4 py-2 font-semibold text-white hover:bg-indigo-700">Sign up</button>
  </form>
  <p class="mt-4 text-center text-sm text-slate-500">Already have an account? <a href="/login" class="text-indigo-600 hover:underline">Log in</a></p>
</div>
{% endblock %}
