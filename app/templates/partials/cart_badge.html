<a id="cart-badge" href="/cart" {% if oob %}hx-swap-oob="true"{% endif %}
   class="relative inline-flex items-center gap-1 text-slate-600 hover:text-indigo-600">
  Cart
  {% if cart_count and cart_count > 0 %}
    <span class="inline-flex h-5 min-w-5 items-center justify-center rounded-full bg-indigo-600 px-1.5 text-xs font-semibold text-white">{{ cart_count }}</span>
  {% endif %}
</a>
