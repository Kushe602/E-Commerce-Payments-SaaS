{% extends 'base.html' %}
{% block title %}Admin · {{ app_name }}{% endblock %}
{% block content %}
<div class="mb-6 flex items-center justify-between">
  <h1 class="text-2xl font-bold">Admin dashboard</h1>
  <div class="flex gap-2 text-sm">
    <a href="/admin/products" class="rounded-lg border border-slate-300 px-3 py-1.5 hover:border-indigo-400">Products</a>
    <a href="/admin/orders" class="rounded-lg border border-slate-300 px-3 py-1.5 hover:border-indigo-400">Orders</a>
    <a href="/admin/coupons" class="rounded-lg border border-slate-300 px-3 py-1.5 hover:border-indigo-400">Coupons</a>
  </div>
</div>
<div class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-4">
  <div class="rounded-2xl border border-slate-200 bg-white p-6">
    <p class="text-sm text-slate-500">Products</p>
    <p class="mt-1 text-3xl font-black">{{ product_count }}</p>
  </div>
  <div class="rounded-2xl border border-slate-200 bg-white p-6">
    <p class="text-sm text-slate-500">Orders</p>
    <p class="mt-1 text-3xl font-black">{{ order_count }}</p>
  </div>
  <div class="rounded-2xl border border-slate-200 bg-white p-6">
    <p class="text-sm text-slate-500">Coupons</p>
    <p class="mt-1 text-3xl font-black">{{ coupon_count }}</p>
  </div>
  <div class="rounded-2xl border border-slate-200 bg-white p-6">
    <p class="text-sm text-slate-500">Captured revenue</p>
    <p class="mt-1 text-3xl font-black text-emerald-600">{{ revenue_cents | money }}</p>
  </div>
</div>
{% endblock %}
